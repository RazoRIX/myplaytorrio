name: Build PlayTorrio Enhanced APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 36 and NDK 28
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;28.0.13004108"
          printf 'sdk.dir=%s\n' "$ANDROID_SDK_ROOT" > local.properties

      - name: Apply PlayTorrio Enhanced patch
        run: python3 scripts/apply_audio_enhancements.py

      - name: Save generated source diff
        shell: bash
        run: |
          git diff --check
          git diff -- app app/src > enhanced-source.patch || true
          git diff --stat
      - name: Restore signing keystore
        id: signing-cache
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: playtorrio-enhanced-signing-v1

      - name: Create signing keystore if missing
        shell: bash
        run: |
          mkdir -p ~/.config/.android
          if [ ! -f ~/.config/.android/debug.keystore ]; then
            keytool -genkeypair \
              -keystore ~/.config/.android/debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=PlayTorrio Enhanced,O=PlayTorrio Enhanced,C=TN"
          fi

      - name: Build Full Release APK
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew assembleFullRelease --no-daemon --stacktrace

      - name: Collect ARM64 APK
        shell: bash
        run: |
          mkdir -p enhanced-apks
          find app/build/outputs/apk/full \
            -type f \
            -name '*arm64-v7a*release*.apk' \
            -print \
            -exec cp '{}' enhanced-apks/ \;
      
          test -n "$(find enhanced-apks -name '*.apk' -print -quit)"
          ls -lh enhanced-apks

      - name: Upload PlayTorrio Enhanced APK
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-Enhanced-APK
          path: enhanced-apks/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload patch report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PlayTorrio-Enhanced-build-report
          path: |
            enhanced-patch-report.txt
            enhanced-source.patch
          if-no-files-found: warn
          retention-days: 14
